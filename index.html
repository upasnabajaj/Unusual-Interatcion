<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#08090e" />
    <title>Unusual Interaction</title>
    <link rel="icon" href="data:," />
    <link rel="preload" href="assets/environment.png" as="image" />

    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="screen-two.css?v=petal-fairy-20" />
    <link rel="stylesheet" href="screen-three.css?v=petal-fairy-20" />
    <link rel="stylesheet" href="fairy-3d.css?v=petal-fairy-20" />
  </head>
  <body>
    <main
      id="screen-one"
      aria-label="An encounter with a fairy"
      data-state="idle"
    >
      <img
        class="environment"
        src="assets/environment.png"
        alt=""
        draggable="false"
      />
      <img
        class="environment environment-light"
        src="assets/environment.png"
        alt=""
        draggable="false"
        aria-hidden="true"
      />
      <div class="fairy-position" id="fairy-position">
        <div class="fairy-float">
          <div
            class="fairy-turn"
            id="fairy-turn"
            role="button"
            tabindex="0"
            aria-label="Fairy. Double-tap to twirl"
            aria-describedby="dialogue-text"
          >
            <div class="fairy-art" aria-hidden="true"></div>
          </div>
          <div class="dialogue">
            <img src="assets/dialogue.svg" alt="" draggable="false" />
            <p id="dialogue-text">
              Tap me twice<br /><span>to move next.</span>
            </p>
          </div>
        </div>
      </div>
    </main>
    <script type="module" src="js/main.js?v=petal-fairy-20"></script>
  </body>
</html>
